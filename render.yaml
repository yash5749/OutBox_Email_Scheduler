databases:
  - name: reachinbox-db
    plan: basic-256mb
    databaseName: reachinbox
    user: reachinbox

services:
  - type: keyvalue
    name: reachinbox-redis
    plan: starter
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

  - type: web
    name: reachinbox-api
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @reachinbox/shared build && pnpm --filter @reachinbox/api prisma:generate && pnpm --filter @reachinbox/api build
    preDeployCommand: pnpm --filter @reachinbox/api exec prisma migrate deploy --schema=../../prisma/schema.prisma
    startCommand: pnpm --filter @reachinbox/api start
    healthCheckPath: /health/live
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: reachinbox-redis
          type: keyvalue
          property: connectionString
      - key: API_BASE_URL
        sync: false
      - key: WEB_URL
        sync: false
      - key: ELASTICSEARCH_URL
        sync: false
      - key: ELASTICSEARCH_USERNAME
        sync: false
      - key: ELASTICSEARCH_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_CALLBACK_URL
        sync: false
      - key: BULL_BOARD_ADMIN_EMAILS
        sync: false

  - type: worker
    name: reachinbox-worker
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @reachinbox/shared build && pnpm --filter @reachinbox/worker build
    startCommand: pnpm --filter @reachinbox/worker start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: reachinbox-redis
          type: keyvalue
          property: connectionString
      - key: ELASTICSEARCH_URL
        sync: false
      - key: ELASTICSEARCH_USERNAME
        sync: false
      - key: ELASTICSEARCH_PASSWORD
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: WORKER_CONCURRENCY
        value: "10"
      - key: MIN_DELAY_BETWEEN_EMAILS_MS
        value: "2000"
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: "200"
      - key: RATE_LIMIT_WINDOW
        value: UTC_FIXED_HOUR
      - key: EMAIL_JOB_ATTEMPTS
        value: "5"
      - key: EMAIL_RETRY_BASE_DELAY_MS
        value: "5000"
